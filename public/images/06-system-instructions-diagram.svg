<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg6)"/>
  <rect x="20" y="20" width="1160" height="635" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>

  <rect x="20" y="20" width="1160" height="50" rx="14" fill="#0F172A"/>
  <text x="50" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Google AI Studio · System Instructions Configuration</text>
  <text x="750" y="51" fill="#C084FC" font-family="monospace" font-size="12">[แผนภาพอธิบายการตั้งค่า System Instructions - ai.google.dev]</text>

  <!-- Visual Mock of System Instructions Panel -->
  <rect x="60" y="90" width="1080" height="260" rx="12" fill="#111827" stroke="#A855F7" stroke-width="2"/>
  
  <rect x="80" y="110" width="320" height="30" rx="6" fill="#3B0764" stroke="#C084FC" stroke-width="1"/>
  <text x="95" y="130" fill="#F3E8FF" font-family="monospace" font-size="13" font-weight="bold">⚙️ SYSTEM INSTRUCTIONS (คำสั่งระบบ)</text>
  <circle cx="400" cy="110" r="14" fill="#EF4444"/>
  <text x="395" y="115" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">1</text>

  <!-- Pre-filled System Instructions Text Box -->
  <rect x="80" y="155" width="1040" height="175" rx="8" fill="#030712" stroke="#374151" stroke-width="1"/>
  <text x="100" y="185" fill="#C084FC" font-family="monospace" font-size="13" font-weight="bold">คุณคือผู้ช่วย AI ประจำร้าน ShopHub ที่สุภาพ อบอุ่น และตอบตรงประเด็น</text>
  <text x="100" y="215" fill="#E5E7EB" font-family="monospace" font-size="13">1. หน้าที่: ตอบคำถามสินค้า, เงื่อนไขจัดส่ง (1-3 วันทำการ), ส่งฟรีเมื่อซื้อครบ 500 บาท</text>
  <text x="100" y="240" fill="#E5E7EB" font-family="monospace" font-size="13">2. น้ำเสียง: ใช้ภาษาไทยสุภาพ มีหางเสียง (ครับ/ค่ะ) เสมอ</text>
  <text x="100" y="265" fill="#E5E7EB" font-family="monospace" font-size="13">3. กฎเหล็ก: ห้ามคาดเดาข้อมูลที่ไม่ระบุ และห้ามตอบข้อมูลเท็จเด็ดขาด</text>
  <text x="100" y="290" fill="#E5E7EB" font-family="monospace" font-size="13">4. Fallback: หากลูกค้าถามนอกเรื่อง ให้แนะนำอีเมล support@shophub.com อย่างสุภาพ</text>

  <!-- 4 Pillars Breakdown below -->
  <rect x="60" y="375" width="255" height="240" rx="10" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1"/>
  <text x="80" y="410" fill="#818CF8" font-family="sans-serif" font-size="15" font-weight="bold">1. Persona &amp; Tone</text>
  <text x="80" y="440" fill="#C7D2FE" font-family="sans-serif" font-size="13">กำหนดว่าบอทคือใคร</text>
  <text x="80" y="465" fill="#94A3B8" font-family="sans-serif" font-size="12">• ผู้ช่วยประจำร้าน ShopHub</text>
  <text x="80" y="490" fill="#94A3B8" font-family="sans-serif" font-size="12">• อบอุ่น เป็นมิตร สุภาพ</text>
  <text x="80" y="515" fill="#94A3B8" font-family="sans-serif" font-size="12">• มีหางเสียง (ครับ/ค่ะ)</text>

  <rect x="335" y="375" width="255" height="240" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="355" y="410" fill="#38BDF8" font-family="sans-serif" font-size="15" font-weight="bold">2. Scope &amp; Info</text>
  <text x="355" y="440" fill="#BAE6FD" font-family="sans-serif" font-size="13">ขอบเขตข้อมูลที่ตอบได้</text>
  <text x="355" y="465" fill="#94A3B8" font-family="sans-serif" font-size="12">• นโยบายส่ง 1-3 วัน</text>
  <text x="355" y="490" fill="#94A3B8" font-family="sans-serif" font-size="12">• ส่งฟรีเมื่อครบ 500 บาท</text>
  <text x="355" y="515" fill="#94A3B8" font-family="sans-serif" font-size="12">• รับประกันเปลี่ยนใน 14 วัน</text>

  <rect x="610" y="375" width="255" height="240" rx="10" fill="#1F1318" stroke="#E11D48" stroke-width="1"/>
  <text x="630" y="410" fill="#FB7185" font-family="sans-serif" font-size="15" font-weight="bold">3. Guardrails</text>
  <text x="630" y="440" fill="#FECDD3" font-family="sans-serif" font-size="13">กฎเหล็กและข้อห้าม</text>
  <text x="630" y="465" fill="#94A3B8" font-family="sans-serif" font-size="12">• ห้ามแต่งเรื่อง (Hallucination)</text>
  <text x="630" y="490" fill="#94A3B8" font-family="sans-serif" font-size="12">• ห้ามเปิดเผย API Key</text>
  <text x="630" y="515" fill="#94A3B8" font-family="sans-serif" font-size="12">• ห้ามคุยเรื่องนอกประเด็น</text>

  <rect x="885" y="375" width="255" height="240" rx="10" fill="#062E25" stroke="#059669" stroke-width="1"/>
  <text x="905" y="410" fill="#34D399" font-family="sans-serif" font-size="15" font-weight="bold">4. Fallback</text>
  <text x="905" y="440" fill="#A7F3D0" font-family="sans-serif" font-size="13">ทางออกเมื่อไม่รู้คำตอบ</text>
  <text x="905" y="465" fill="#94A3B8" font-family="sans-serif" font-size="12">• ปฏิเสธอย่างสุภาพ</text>
  <text x="905" y="490" fill="#94A3B8" font-family="sans-serif" font-size="12">• แนะนำอีเมลติดต่อทีมงาน</text>
  <text x="905" y="515" fill="#94A3B8" font-family="sans-serif" font-size="12">• ดึงกลับเข้าสู่เรื่องสินค้า</text>
</svg>