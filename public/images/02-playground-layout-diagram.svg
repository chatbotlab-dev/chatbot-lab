<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)"/>
  <rect x="20" y="20" width="1160" height="635" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Title Bar -->
  <rect x="20" y="20" width="1160" height="50" rx="14" fill="#0F172A"/>
  <text x="50" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Google AI Studio · Prompt Playground Layout</text>
  <text x="750" y="51" fill="#C084FC" font-family="monospace" font-size="12">[แผนภาพอธิบายโครงสร้างหน้าจอ Playground - ai.google.dev]</text>

  <!-- Left Sidebar (Width: 260px) -->
  <rect x="35" y="85" width="250" height="550" rx="10" fill="#090E1B" stroke="#1E293B" stroke-width="1"/>
  
  <!-- + Create Prompt Button (Callout 1) -->
  <rect x="50" y="105" width="220" height="44" rx="8" fill="#2563EB"/>
  <text x="95" y="133" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">+ Create Prompt</text>
  <circle cx="270" cy="105" r="15" fill="#EF4444" filter="url(#glow2)"/>
  <text x="265" y="110" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold">1</text>

  <!-- Dropdown Options Popup (Callout 2) -->
  <rect x="60" y="160" width="200" height="140" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="65" y="165" width="190" height="40" rx="6" fill="#2E1065" stroke="#A855F7" stroke-width="1.5"/>
  <text x="75" y="190" fill="#F3E8FF" font-family="sans-serif" font-size="13" font-weight="bold">💬 Chat prompt (เลือกอันนี้)</text>
  <circle cx="255" cy="165" r="14" fill="#EF4444" filter="url(#glow2)"/>
  <text x="250" y="170" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">2</text>

  <text x="75" y="230" fill="#94A3B8" font-family="sans-serif" font-size="12">📄 Freeform prompt</text>
  <text x="75" y="265" fill="#94A3B8" font-family="sans-serif" font-size="12">📊 Structured prompt</text>

  <!-- Sidebar Nav items -->
  <text x="55" y="340" fill="#64748B" font-family="sans-serif" font-size="12" font-weight="bold">NAVIGATION</text>
  <rect x="50" y="360" width="220" height="35" rx="6" fill="#1E293B"/>
  <text x="65" y="382" fill="#FFFFFF" font-family="sans-serif" font-size="13">📁 My Prompts Library</text>
  <rect x="50" y="405" width="220" height="35" rx="6" fill="transparent"/>
  <text x="65" y="427" fill="#94A3B8" font-family="sans-serif" font-size="13">🔑 Get API key</text>
  <rect x="50" y="450" width="220" height="35" rx="6" fill="transparent"/>
  <text x="65" y="472" fill="#94A3B8" font-family="sans-serif" font-size="13">⚙️ Settings</text>

  <!-- Center Canvas (Chat Area) -->
  <rect x="300" y="85" width="590" height="550" rx="10" fill="#070B14" stroke="#1E293B" stroke-width="1"/>
  <!-- System Instructions Drawer -->
  <rect x="315" y="100" width="560" height="120" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="330" y="125" fill="#C084FC" font-family="monospace" font-size="12" font-weight="bold">SYSTEM INSTRUCTIONS PANEL</text>
  <text x="330" y="150" fill="#9CA3AF" font-family="sans-serif" font-size="12">พื้นที่สำหรับกำหนดตัวตน (Persona), บทบาท, กฎเหล็ก และขอบเขตการตอบของ AI</text>
  <text x="330" y="175" fill="#6B7280" font-family="sans-serif" font-size="12">ตัวอย่าง: "คุณคือผู้ช่วย AI ประจำร้าน ShopHub ตอบคำถามอย่างสุภาพ..."</text>

  <!-- Chat conversation stream -->
  <rect x="315" y="235" width="560" height="280" rx="8" fill="#030712" stroke="#1F2937" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="500" y="370" fill="#4B5563" font-family="sans-serif" font-size="14">[ Multi-turn Chat Conversation Canvas ]</text>
  <text x="480" y="395" fill="#374151" font-family="sans-serif" font-size="12">แสดงประวัติการคุยระหว่าง User และ Gemini Model</text>

  <!-- Bottom Input Bar -->
  <rect x="315" y="530" width="560" height="45" rx="8" fill="#1E293B" stroke="#4B5563" stroke-width="1"/>
  <text x="330" y="558" fill="#9CA3AF" font-family="sans-serif" font-size="13">Type something to chat with Gemini...</text>
  <rect x="815" y="536" width="50" height="32" rx="6" fill="#2563EB"/>
  <text x="828" y="557" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">Run</text>

  <!-- Right Sidebar (Run Settings Panel - Width: 280px) -->
  <rect x="905" y="85" width="260" height="550" rx="10" fill="#090E1B" stroke="#1E293B" stroke-width="1"/>
  <text x="925" y="115" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="bold">Run Settings</text>
  
  <text x="925" y="150" fill="#94A3B8" font-family="sans-serif" font-size="12">Model:</text>
  <rect x="925" y="160" width="220" height="35" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="938" y="182" fill="#FFFFFF" font-family="monospace" font-size="12">gemini-2.5-flash ▼</text>

  <text x="925" y="225" fill="#94A3B8" font-family="sans-serif" font-size="12">Temperature: 0.2</text>
  <line x1="925" y1="240" x2="1145" y2="240" stroke="#334155" stroke-width="4"/>
  <circle cx="960" cy="240" r="8" fill="#A855F7"/>

  <text x="925" y="285" fill="#94A3B8" font-family="sans-serif" font-size="12">Top P: 0.95</text>
  <line x1="925" y1="300" x2="1145" y2="300" stroke="#334155" stroke-width="4"/>
  <circle cx="1110" cy="300" r="8" fill="#A855F7"/>

  <!-- Get Code Button (Callout 3) -->
  <rect x="925" y="490" width="220" height="44" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
  <text x="985" y="517" fill="#E9D5FF" font-family="monospace" font-size="13" font-weight="bold">&lt;/&gt; Get Code</text>
  <circle cx="1145" cy="490" r="14" fill="#EF4444" filter="url(#glow2)"/>
  <text x="1140" y="495" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">3</text>
</svg>