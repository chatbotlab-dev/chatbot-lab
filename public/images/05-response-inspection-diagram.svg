<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg5)"/>
  <rect x="20" y="20" width="1160" height="635" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>

  <rect x="20" y="20" width="1160" height="50" rx="14" fill="#0F172A"/>
  <text x="50" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Google AI Studio · Sending Message &amp; Inspecting Response</text>
  <text x="750" y="51" fill="#C084FC" font-family="monospace" font-size="12">[แผนภาพอธิบายผลลัพธ์คำตอบและสถิติ - ai.google.dev]</text>

  <!-- Left: Before Sending State -->
  <rect x="60" y="90" width="520" height="530" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="110" width="160" height="28" rx="6" fill="#334155"/>
  <text x="95" y="129" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">1. ก่อนส่ง (Before Run)</text>

  <rect x="80" y="160" width="480" height="120" rx="8" fill="#030712" stroke="#1F2937" stroke-width="1"/>
  <text x="100" y="190" fill="#94A3B8" font-family="sans-serif" font-size="12">User Input Draft:</text>
  <text x="100" y="220" fill="#FFFFFF" font-family="monospace" font-size="13">สั่งของไปเมื่อวาน ยอด 650 บาท ได้รับส่งฟรีไหม?</text>

  <rect x="390" y="300" width="170" height="40" rx="8" fill="#2563EB"/>
  <text x="410" y="325" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">▶ กดปุ่ม Run (Ctrl+↵)</text>
  <circle cx="560" cy="300" r="14" fill="#EF4444"/>
  <text x="555" y="305" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">1</text>

  <rect x="80" y="370" width="480" height="220" rx="8" fill="#111827"/>
  <text x="100" y="405" fill="#60A5FA" font-family="sans-serif" font-size="13" font-weight="bold">คำแนะนำก่อนกดส่ง:</text>
  <text x="100" y="440" fill="#94A3B8" font-family="sans-serif" font-size="13">• ตรวจสอบโมเดลที่เลือกด้านบน (แนะนำ: gemini-2.5-flash)</text>
  <text x="100" y="475" fill="#94A3B8" font-family="sans-serif" font-size="13">• ตรวจสอบว่าใส่ System Instructions แล้วหรือยัง</text>
  <text x="100" y="510" fill="#94A3B8" font-family="sans-serif" font-size="13">• ใช้คีย์ลัด Ctrl + Enter เพื่อความสะดวกรวดเร็ว</text>

  <!-- Right: After Response Received State -->
  <rect x="620" y="90" width="520" height="530" rx="12" fill="#0D1527" stroke="#10B981" stroke-width="1.5"/>
  <rect x="640" y="110" width="200" height="28" rx="6" fill="#065F46"/>
  <text x="655" y="129" fill="#A7F3D0" font-family="sans-serif" font-size="13" font-weight="bold">2. หลังได้รับคำตอบ (After 200 OK)</text>

  <!-- Latency and token stats bar -->
  <rect x="640" y="155" width="480" height="40" rx="6" fill="#022C22" stroke="#059669" stroke-width="1"/>
  <text x="660" y="180" fill="#34D399" font-family="monospace" font-size="12" font-weight="bold">⏱️ Response Time: 0.64s | 📊 92 Tokens | Model: 2.5 Flash</text>

  <!-- User Bubble -->
  <rect x="820" y="215" width="300" height="45" rx="8" fill="#4F46E5"/>
  <text x="840" y="242" fill="#FFFFFF" font-family="sans-serif" font-size="12">สั่งของไปเมื่อวาน ยอด 650 บาท ได้รับส่งฟรีไหม?</text>

  <!-- Model Response Bubble -->
  <rect x="640" y="280" width="480" height="200" rx="8" fill="#1E1B4B" stroke="#6366F1" stroke-width="1"/>
  <text x="660" y="310" fill="#C084FC" font-family="monospace" font-size="12" font-weight="bold">Gemini Output (System Guided):</text>
  <text x="660" y="340" fill="#E0E7FF" font-family="sans-serif" font-size="13">สวัสดีครับคุณลูกค้า! สำหรับยอดสั่งซื้อ 650 บาท</text>
  <text x="660" y="365" fill="#E0E7FF" font-family="sans-serif" font-size="13">ได้รับสิทธิ์ **จัดส่งฟรี** ทันทีครับ (เงื่อนไขส่งฟรีครบ 500 บาท)</text>
  <text x="660" y="390" fill="#E0E7FF" font-family="sans-serif" font-size="13">สินค้าจะจัดส่งถึงมือใน 1 - 3 วันทำการครับ!</text>
  <circle cx="1120" cy="280" r="14" fill="#EF4444"/>
  <text x="1115" y="285" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">2</text>

  <rect x="640" y="500" width="480" height="95" rx="8" fill="#020617"/>
  <text x="660" y="530" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="bold">✓ ตรวจสอบความถูกต้อง:</text>
  <text x="660" y="555" fill="#94A3B8" font-family="sans-serif" font-size="12">สังเกตว่า AI ตอบตรงตามข้อมูลเงื่อนไข 500 บาท มีหางเสียงสุภาพ</text>
  <text x="660" y="575" fill="#94A3B8" font-family="sans-serif" font-size="12">และสามารถกดปุ่ม Regenerate หากต้องการดูแนวทางการตอบอื่น</text>
</svg>