<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="heroBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="635" rx="16" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- Browser Header Bar -->
  <rect x="20" y="20" width="1160" height="55" rx="16" fill="#111827"/>
  <circle cx="55" cy="47" r="6" fill="#EF4444"/>
  <circle cx="75" cy="47" r="6" fill="#F59E0B"/>
  <circle cx="95" cy="47" r="6" fill="#10B981"/>
  
  <!-- URL Address Bar -->
  <rect x="180" y="32" width="840" height="30" rx="8" fill="#030712" stroke="#374151" stroke-width="1"/>
  <text x="200" y="52" fill="#10B981" font-family="monospace" font-size="13">🔒 https://</text>
  <text x="285" y="52" fill="#E5E7EB" font-family="monospace" font-size="13" font-weight="bold">aistudio.google.com</text>
  <text x="460" y="52" fill="#6B7280" font-family="sans-serif" font-size="12">| Google AI Studio Official Portal</text>

  <!-- Watermark / Diagram Disclaimer Tag -->
  <rect x="820" y="85" width="340" height="28" rx="6" fill="#311042" stroke="#A855F7" stroke-width="1"/>
  <text x="835" y="103" fill="#E9D5FF" font-family="sans-serif" font-size="11" font-weight="bold">[แผนภาพอธิบายโครงสร้าง - แหล่งอ้างอิง: ai.google.dev]</text>

  <!-- Main AI Studio Top Navigation -->
  <rect x="50" y="120" width="1100" height="60" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <!-- Google AI Studio Logo Text -->
  <circle cx="80" cy="150" r="16" fill="#4F46E5"/>
  <text x="73" y="156" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">✦</text>
  <text x="110" y="156" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">Google AI Studio</text>
  
  <text x="340" y="155" fill="#94A3B8" font-family="sans-serif" font-size="14">Overview</text>
  <text x="440" y="155" fill="#94A3B8" font-family="sans-serif" font-size="14">Documentation</text>
  <text x="580" y="155" fill="#94A3B8" font-family="sans-serif" font-size="14">Pricing</text>

  <!-- Sign In Button (Callout 1) -->
  <rect x="960" y="132" width="170" height="36" rx="8" fill="url(#btnGrad)"/>
  <text x="985" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="bold">Sign in with Google</text>
  
  <!-- Number 1 Callout Badge -->
  <circle cx="1140" cy="130" r="16" fill="#EF4444" filter="url(#glow)"/>
  <text x="1135" y="136" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">1</text>
  <line x1="1140" y1="146" x2="1090" y2="168" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Hero Content Area -->
  <rect x="50" y="200" width="1100" height="390" rx="14" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="1"/>
  
  <text x="100" y="270" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="2">GEMINI FOR DEVELOPERS</text>
  <text x="100" y="325" fill="#FFFFFF" font-family="sans-serif" font-size="36" font-weight="bold">Fastest way to build with Gemini</text>
  <text x="100" y="370" fill="#9CA3AF" font-family="sans-serif" font-size="16">The web-based prototyping environment for prompt engineering, model tuning,</text>
  <text x="100" y="395" fill="#9CA3AF" font-family="sans-serif" font-size="16">and instant API key generation with generous Free Tier quotas.</text>

  <!-- Hero Action Button (Callout 2) -->
  <rect x="100" y="435" width="250" height="52" rx="12" fill="url(#heroBtnGrad)"/>
  <text x="135" y="467" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Get Started in AI Studio →</text>
  <circle cx="360" cy="435" r="16" fill="#EF4444" filter="url(#glow)"/>
  <text x="355" y="441" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">2</text>

  <!-- Secondary CTA: Get API Key -->
  <rect x="375" y="435" width="180" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="420" y="467" fill="#CBD5E1" font-family="sans-serif" font-size="15" font-weight="semibold">Get API Key 🔑</text>

  <!-- Bottom Explanatory Banner -->
  <rect x="50" y="520" width="1100" height="55" rx="8" fill="#030712" stroke="#1E293B" stroke-width="1"/>
  <text x="70" y="552" fill="#F59E0B" font-family="sans-serif" font-size="14" font-weight="bold">💡 จุดสังเกตสำคัญ:</text>
  <text x="210" y="552" fill="#E2E8F0" font-family="sans-serif" font-size="13">[1] ปุ่ม Sign In ด้านบนขวาสำหรับเข้าสู่ระบบด้วย Gmail | [2] ปุ่ม Get Started กลางหน้าจอเพื่อเข้าสู่หน้าสร้าง Chat Prompt ทันที</text>
</svg>