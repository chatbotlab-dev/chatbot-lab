<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg7)"/>
  <rect x="20" y="20" width="1160" height="635" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>

  <rect x="20" y="20" width="1160" height="50" rx="14" fill="#0F172A"/>
  <text x="50" y="52" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">Google AI Studio · Run Settings &amp; Hyperparameters</text>
  <text x="750" y="51" fill="#C084FC" font-family="monospace" font-size="12">[แผนภาพอธิบายการตั้งค่าพารามิเตอร์ - ai.google.dev]</text>

  <!-- Right Panel Simulation expanded -->
  <rect x="60" y="90" width="1080" height="440" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>

  <!-- Parameter 1: Temperature -->
  <rect x="90" y="120" width="480" height="170" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="115" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">🌡️ Temperature (ระดับความสุ่ม/แม่นยำ)</text>
  <text x="115" y="185" fill="#94A3B8" font-family="sans-serif" font-size="13">ควบคุมว่า AI จะตอบแบบยึดข้อเท็จจริง หรือตอบแบบสร้างสรรค์</text>
  
  <line x1="115" y1="220" x2="535" y2="220" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="220" r="12" fill="#A855F7"/>
  <text x="150" y="255" fill="#C084FC" font-family="monospace" font-size="14" font-weight="bold">0.2</text>

  <text x="115" y="275" fill="#10B981" font-family="sans-serif" font-size="12">✓ แนะนำ 0.1 - 0.3 สำหรับแชทบอทตอบคำถามลูกค้า</text>

  <!-- Parameter 2: Top P -->
  <rect x="610" y="120" width="500" height="170" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="635" y="155" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="bold">🎯 Top P (Nucleus Sampling)</text>
  <text x="635" y="185" fill="#94A3B8" font-family="sans-serif" font-size="13">ตัดคำที่มีความน่าจะเป็นสะสมรวมกันต่ำออกไป</text>

  <line x1="635" y1="220" x2="1075" y2="220" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1040" cy="220" r="12" fill="#A855F7"/>
  <text x="1025" y="255" fill="#C084FC" font-family="monospace" font-size="14" font-weight="bold">0.95</text>

  <text x="635" y="275" fill="#10B981" font-family="sans-serif" font-size="12">✓ ค่ามาตรฐาน 0.95 เพื่อความลื่นไหลของประโยค</text>

  <!-- Safety Settings & Get Code -->
  <rect x="90" y="320" width="480" height="180" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="115" y="355" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="bold">🛡️ Safety Settings (ตัวกรองความปลอดภัย)</text>
  <text x="115" y="385" fill="#94A3B8" font-family="sans-serif" font-size="12">• Harassment: Block some</text>
  <text x="115" y="410" fill="#94A3B8" font-family="sans-serif" font-size="12">• Hate Speech: Block some</text>
  <text x="115" y="435" fill="#94A3B8" font-family="sans-serif" font-size="12">• Sexually Explicit: Block some</text>
  <text x="115" y="460" fill="#94A3B8" font-family="sans-serif" font-size="12">• Dangerous Content: Block some</text>

  <rect x="610" y="320" width="500" height="180" rx="10" fill="#2E1065" stroke="#A855F7" stroke-width="1.5"/>
  <text x="635" y="355" fill="#F3E8FF" font-family="sans-serif" font-size="15" font-weight="bold">&lt;/&gt; Get Code (ปุ่มส่งออกโค้ด)</text>
  <text x="635" y="385" fill="#D8B4FE" font-family="sans-serif" font-size="13">เมื่อทดสอบใน Playground จนพอใจแล้ว ให้คลิกปุ่ม &quot;Get Code&quot; ทางขวาบน</text>
  <text x="635" y="415" fill="#D8B4FE" font-family="sans-serif" font-size="13">ระบบจะสร้างโค้ด JavaScript/TypeScript, Python หรือ cURL</text>
  <text x="635" y="440" fill="#D8B4FE" font-family="sans-serif" font-size="13">นำไปแปะใน Backend Proxy ได้ทันทีโดยไม่ต้องเขียนเอง</text>
  
  <rect x="635" y="460" width="160" height="28" rx="6" fill="#9333EA"/>
  <text x="655" y="479" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold">Export Code ↗</text>

  <!-- Explanatory Bottom Tag -->
  <rect x="60" y="550" width="1080" height="60" rx="8" fill="#030712" stroke="#1F2937" stroke-width="1"/>
  <text x="80" y="585" fill="#F59E0B" font-family="sans-serif" font-size="13" font-weight="bold">📌 ข้อแนะนำสำหรับโปรดักชัน:</text>
  <text x="280" y="585" fill="#CBD5E1" font-family="sans-serif" font-size="13">ตั้งค่า Temperature ต่ำ (0.2) เพื่อคำตอบที่แม่นยำ และใช้ Get Code เพื่อนำโค้ดไปติดตั้งกับ Express ในบทที่ 4</text>
</svg>